services:
  # create a SuperLink service
  superlink:
    image: flwr/superlink:${FLWR_VERSION:-1.12.0}
    command:
      - --insecure

  # create a SuperExec service
  superexec:
    build:
      context: ${PROJECT_DIR:-.}
      dockerfile: superexec.Dockerfile
    ports:
      - 9093:9093
    command:
      - --executor
      - flwr.superexec.deployment:executor
      - --insecure
      - --executor-config
      - superlink="superlink:9091"
    volumes:
      - "./agg-weights:/app/agg-weights/"
    depends_on:
      - superlink

  # create a two SuperNode service with different node configs
  supernode-1:
    image: flwr/supernode:${FLWR_VERSION:-1.12.0}
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --supernode-address
      - 0.0.0.0:9094
      - --isolation
      - process
      - --node-config
      - "partition-id=0 num-partitions=2"
    depends_on:
      - superlink

  supernode-2:
    image: flwr/supernode:${FLWR_VERSION:-1.12.0}
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --supernode-address
      - 0.0.0.0:9095
      - --isolation
      - process
      - --node-config
      - "partition-id=1 num-partitions=2"
    depends_on:
      - superlink

  supernode-3:
    image: flwr/supernode:${FLWR_VERSION:-1.12.0}
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --supernode-address
      - 0.0.0.0:9096
      - --isolation
      - process
      - --node-config
      - "partition-id=2 num-partitions=2"
    depends_on:
      - superlink

  supernode-4:
    image: flwr/supernode:${FLWR_VERSION:-1.12.0}
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --supernode-address
      - 0.0.0.0:9097
      - --isolation
      - process
      - --node-config
      - "partition-id=3 num-partitions=2"
    depends_on:
      - superlink

  supernode-5:
    image: flwr/supernode:${FLWR_VERSION:-1.12.0}
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --supernode-address
      - 0.0.0.0:9098
      - --isolation
      - process
      - --node-config
      - "partition-id=4 num-partitions=2"
    depends_on:
      - superlink

  clientapp-1:
    build:
      context: ${PROJECT_DIR:-.}
      dockerfile: clientapp.Dockerfile
    command:
      - --supernode
      - supernode-1:9094
    deploy:
      resources:
        limits:
          cpus: "2"
    stop_signal: SIGINT
    volumes:
      - "./breastcancer/institution_data/:/app/institution_data/"
    depends_on:
      - supernode-1

  clientapp-2:
    build:
      context: ${PROJECT_DIR:-.}
      dockerfile: clientapp.Dockerfile
    command:
      - --supernode
      - supernode-2:9095
    deploy:
      resources:
        limits:
          cpus: "2"
    stop_signal: SIGINT
    volumes:
      - "./breastcancer/institution_data/:/app/institution_data/"
    depends_on:
      - supernode-2

  clientapp-3:
    build:
      context: ${PROJECT_DIR:-.}
      dockerfile: clientapp.Dockerfile
    command:
      - --supernode
      - supernode-3:9096
    deploy:
      resources:
        limits:
          cpus: "2"
    stop_signal: SIGINT
    volumes:
      - "./breastcancer/institution_data/:/app/institution_data/"
    depends_on:
      - supernode-3

  clientapp-4:
    build:
      context: ${PROJECT_DIR:-.}
      dockerfile: clientapp.Dockerfile
    command:
      - --supernode
      - supernode-4:9097
    deploy:
      resources:
        limits:
          cpus: "2"
    stop_signal: SIGINT
    volumes:
      - "./breastcancer/institution_data/:/app/institution_data/"
    depends_on:
      - supernode-4

  clientapp-5:
    build:
      context: ${PROJECT_DIR:-.}
      dockerfile: clientapp.Dockerfile
    command:
      - --supernode
      - supernode-5:9098
    deploy:
      resources:
        limits:
          cpus: "2"
    stop_signal: SIGINT
    volumes:
      - "./breastcancer/institution_data/:/app/institution_data/"
    depends_on:
      - supernode-5